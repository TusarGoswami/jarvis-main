name: Vocalis AI CI/CD Test Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Run Backend Security & Reliability Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt pytest pytest-asyncio

    - name: Run Pytest Test Suite
      working-directory: backend
      env:
        GEMINI_API_KEYS: "AIzaSy_MOCK_CI_KEY_FOR_TESTING_PURPOSES"
        GROQ_API_KEY: "gsk_MOCK_GROQ_CI_KEY_FOR_TESTING_PURPOSES"
      run: |
        pytest evals/test_evals.py evals/test_multi_step_agent.py -v
