version: '3.8'

services:
  # ============================================================================
  # VOCALIS AI — BACKEND SERVICE (FastAPI, WebSockets, Autonomous Agent Engine)
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vocalis_backend
    restart: unless-stopped
    ports:
      - "8005:8005"
    environment:
      - HOST=0.0.0.0
      - PORT=8005
      - DEBUG=true
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_API_KEY_2=${GEMINI_API_KEY_2}
      - GEMINI_API_KEY_3=${GEMINI_API_KEY_3}
      - GROQ_API_KEY=${GROQ_API_KEY}
    volumes:
      - vocalis_db:/app/workspace
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8005/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ============================================================================
  # VOCALIS AI — FRONTEND SERVICE (Next.js 15 Cybernetic UI)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vocalis_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://backend:8005
      - NEXT_PUBLIC_WS_URL=ws://localhost:8005/ws/stream
    depends_on:
      backend:
        condition: service_healthy

volumes:
  vocalis_db:
