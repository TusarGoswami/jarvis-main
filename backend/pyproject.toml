[project]
name = "vocalis-ai"
version = "0.1.0"
description = "Vocalis AI - Multimodal Voice & Vision Operating System"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.1",
    "pydantic>=2.10.0",
    "google-genai>=1.0.0",
    "cryptography>=43.0.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.2",
    "mss>=9.0.0",
    "pillow>=11.0.0",
    "SpeechRecognition>=3.10.0",
    "pyttsx3>=2.90",
    "edge-tts>=6.1.12",
    "pygame-ce>=2.5.0",
    "pyautogui>=0.9.54",
    "pygetwindow>=0.0.9",
    "pywhatkit>=5.4",
    "psutil>=6.0.0",
    "requests>=2.32.0",
    "pywin32>=306",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
